<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>골프장 거리 계산기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Samsung Sans", "Roboto", "Segoe UI", sans-serif;
    background: #f4f5f7; color: #1a1a1a;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 14px; }
  h1 { font-size: 20px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.4px; }

  .card { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 12px;
          box-shadow: 0 3px 14px rgba(0,0,0,0.06); border: 1px solid #eef0f2; }
  .hint { font-size: 13px; color: #6b7280; margin-bottom: 10px; }
  #map { width: 100%; height: 240px; border-radius: 12px; z-index: 0; background: #e7eaee; }
  .home-info { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
  #home-label { font-size: 13px; color: #374151; font-weight: 600; flex: 1; }
  .gps-btn { border: none; background: #eef2ff; color: #4f46e5; font-weight: 700;
             font-size: 13px; padding: 8px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .gps-btn:active { background: #e0e7ff; }

  .filter { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filter .lbl { font-size: 13px; color: #6b7280; margin-right: 2px; }
  .filter button { border: 1px solid #e2e5ea; background: #fff; color: #374151;
                   font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .filter button.active { background: #16a34a; color: #fff; border-color: #16a34a; }

  .count { font-size: 12px; color: #9ca3af; margin: 2px 2px 8px; }

  .course { background: #fff; border-radius: 14px; padding: 13px 14px; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eef0f2; }
  .c-left { min-width: 0; }
  .c-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-dist { font-size: 13px; color: #16a34a; font-weight: 800; margin-top: 3px; }
  .nav-btn { border: none; background: #03c75a; color: #fff; font-weight: 700; font-size: 12.5px;
             padding: 9px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .nav-btn:active { background: #02b350; }
  .empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 30px 0; }
</style>
</head>
<body>
<div id="app">
  <h1>⛳ 골프장 거리 계산기</h1>

  <div class="card">
    <div class="hint">지도를 탭해서 <b>우리집</b> 위치를 지정하세요</div>
    <div id="map"></div>
    <div class="home-info">
      <span id="home-label">집 위치: 미설정</span>
      <button class="gps-btn" id="gps">📍 현재 위치로</button>
    </div>
  </div>

  <div class="filter">
    <span class="lbl">거리</span>
    <button data-km="0" class="active">전체</button>
    <button data-km="30">30km</button>
    <button data-km="50">50km</button>
    <button data-km="100">100km</button>
    <button data-km="200">200km</button>
  </div>

  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  // [n]ame, [y]lat, [x]lng
  const COURSES = [
    {n:"뉴스프링빌CC (이천)",y:37.1539062,x:127.4199979},
    {n:"비에이비스타CC (이천)",y:37.1803652,x:127.4166682},
    {n:"마이다스 레이크 이천",y:37.1771186,x:127.5244816},
    {n:"웰링턴CC (이천)",y:37.1687464,x:127.4205856},
    {n:"사우스스프링스CC (이천)",y:37.1757456,x:127.4511098},
    {n:"이천실크밸리GC",y:37.0805884,x:127.5728539},
    {n:"크로스비GC 호법 (이천)",y:37.2367185,x:127.4118461},
    {n:"H1클럽 (이천)",y:37.1882147,x:127.4033083},
    {n:"동승골프앤리조트 (이천)",y:37.1564948,x:127.4151441},
    {n:"블랙스톤리조트 (이천)",y:37.1614735,x:127.6179241},
    {n:"포천힐스CC",y:37.8832535,x:127.2443041},
    {n:"힐마루 골프&리조트 (포천)",y:37.9911367,x:127.2254287},
    {n:"푸른솔GC (포천)",y:37.8416698,x:127.2346433},
    {n:"베어크리크 (포천)",y:37.904002,x:127.280471},
    {n:"선힐GC (가평)",y:37.8771921,x:127.3515465},
    {n:"가평베네스트GC",y:37.7971975,x:127.3057765},
    {n:"포천아도니스CC",y:37.9650326,x:127.1652588},
    {n:"라싸골프클럽 (포천)",y:37.9975199,x:127.3805895},
    {n:"베어크리크 (춘천)",y:37.769097,x:127.7195032},
    {n:"오너스골프클럽 (춘천)",y:37.7718173,x:127.6562191},
    {n:"라데나GC (춘천)",y:37.8411301,x:127.7186555},
    {n:"남춘천CC",y:37.7892504,x:127.690912},
    {n:"로드힐스 골프&리조트 (춘천)",y:37.7407348,x:127.7278116},
    {n:"라비에벨CC 올드 (춘천)",y:37.7413124,x:127.7569522},
    {n:"더플레이어스GC (춘천)",y:37.7775897,x:127.7507917},
    {n:"제이드팰리스GC (춘천)",y:37.8309146,x:127.548482},
    {n:"레이크사이드CC (용인)",y:37.3195517,x:127.179116},
    {n:"한국CC (용인)",y:37.2192388,x:127.1513372},
    {n:"지산CC (용인)",y:37.216084,x:127.336528},
    {n:"88CC (용인)",y:37.3027597,x:127.1667733},
    {n:"루트52CC (여주)",y:37.3502669,x:127.7200968},
    {n:"이스트밸리CC (광주)",y:37.4055238,x:127.3846454},
    {n:"곤지암CC (광주)",y:37.3332748,x:127.2954297},
    {n:"한양CC (고양)",y:37.6561073,x:126.8555026},
    {n:"송추CC (양주)",y:37.7949486,x:126.9119494},
    {n:"드림파크CC (인천)",y:37.5728256,x:126.6436309},
    {n:"인천그랜드CC",y:37.5137214,x:126.6412277},
    {n:"베어즈베스트GC (인천)",y:37.5444444,x:126.6344444},
    {n:"인천국제CC",y:37.5618629,x:126.6535847},
    {n:"김포 씨사이드CC",y:37.706053,x:126.5338708},
    {n:"세븐밸리CC (칠곡)",y:36.0170548,x:128.4645369},
    {n:"오션힐스 청도GC",y:35.6767407,x:128.812208},
    {n:"한맥CC (예천)",y:36.6581604,x:128.5211564},
    {n:"노블레스CC (칠곡)",y:36.0474546,x:128.2992255},
    {n:"감포GC (경주)",y:35.773242,x:129.4862531},
    {n:"힐스카이CC (경주)",y:35.9105988,x:129.3142853},
    {n:"그레이스CC (청도)",y:35.6642156,x:128.6450013},
    {n:"경주신라CC",y:35.85084,x:129.2850197},
    {n:"골프존카운티 청통 (영천)",y:35.9877158,x:128.8111278},
    {n:"문경GC",y:36.715215,x:128.161935},
    {n:"힐CC (창녕)",y:35.5005738,x:128.4999053},
    {n:"아라미르 골프리조트 (창원)",y:35.0886554,x:128.7442248},
    {n:"가야CC (김해)",y:35.273929,x:128.898378},
    {n:"골프존카운티 경남 (함안)",y:35.3088429,x:128.5740993},
    {n:"사우스케이프 (남해)",y:34.8374583,x:128.0717862},
    {n:"동훈힐마루CC (창녕)",y:35.4944787,x:128.4968256},
    {n:"타니CC (사천)",y:35.0994819,x:128.0159733},
    {n:"동원로얄CC (통영)",y:34.8101147,x:128.4276676},
    {n:"정산CC (김해)",y:35.253462,x:128.8078381},
    {n:"노벨CC (고성)",y:35.0698317,x:128.4054959},
    {n:"사우스링스 영암",y:34.7356893,x:126.4283883},
    {n:"웨스트오션CC (영광)",y:35.355362,x:126.41153},
    {n:"석정힐CC (고창)",y:35.4267144,x:126.7389465},
    {n:"해남 파인비치CC",y:34.6975595,x:126.2612057},
    {n:"다산베아채 (강진)",y:34.5454996,x:126.758866},
    {n:"파인힐스 (순천)",y:35.0341366,x:127.2721794},
    {n:"고창CC",y:35.515967,x:126.5023076},
    {n:"광주CC (곡성)",y:35.3101401,x:127.1699263},
    {n:"더나인GC (김제)",y:35.7954234,x:127.0344679},
    {n:"에콜리안 영광CC",y:35.2948605,x:126.5013815},
    {n:"나인브릿지 (제주)",y:33.3418079,x:126.4054915},
    {n:"엘리시안 제주CC",y:33.3723833,x:126.3811418},
    {n:"롯데 스카이힐 제주CC",y:33.2871149,x:126.4052324},
    {n:"제주 블랙스톤CC",y:33.3364519,x:126.3110848},
    {n:"에코랜드GC (제주)",y:33.4565209,x:126.6670479},
    {n:"해비치CC (제주)",y:33.3603865,x:126.7256185},
    {n:"타뮤즈 골프빌리지 (제주)",y:33.3689588,x:126.3505941},
    {n:"테디밸리 골프&리조트 (제주)",y:33.2917697,x:126.3482597},
    {n:"핀크스GC (제주)",y:33.3053535,x:126.3937346}
  ];

  let home = null, homeMarker = null, maxKm = 0;

  // 지도 초기화 (대한민국 중심)
  const map = L.map('map').setView([36.5, 127.8], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  setTimeout(() => map.invalidateSize(), 300);

  map.on('click', e => setHome(e.latlng.lat, e.latlng.lng, false));

  // 저장된 집 위치 불러오기
  try {
    const saved = localStorage.getItem('golf_home');
    if (saved) { const h = JSON.parse(saved); setHome(h.lat, h.lng, true); map.setView([h.lat, h.lng], 9); }
  } catch (e) {}

  function setHome(lat, lng, silent) {
    home = { lat, lng };
    if (homeMarker) homeMarker.setLatLng([lat, lng]);
    else homeMarker = L.marker([lat, lng]).addTo(map).bindPopup('우리집');
    document.getElementById('home-label').textContent =
      '집 위치: ' + lat.toFixed(4) + ', ' + lng.toFixed(4);
    try { localStorage.setItem('golf_home', JSON.stringify(home)); } catch (e) {}
    render();
  }

  // 현재 위치(GPS)
  document.getElementById('gps').addEventListener('click', () => {
    if (!navigator.geolocation) { alert('위치 기능을 사용할 수 없어요.'); return; }
    navigator.geolocation.getCurrentPosition(
      p => { setHome(p.coords.latitude, p.coords.longitude, false); map.setView([p.coords.latitude, p.coords.longitude], 11); },
      () => alert('위치를 가져오지 못했어요. 지도를 직접 탭해 주세요.')
    );
  });

  // 거리 필터
  document.querySelectorAll('.filter button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.filter button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      maxKm = Number(b.dataset.km);
      render();
    });
  });

  // 두 좌표 사이 직선거리 (km)
  function dist(aLat, aLng, bLat, bLng) {
    const R = 6371, toR = d => d * Math.PI / 180;
    const dLat = toR(bLat - aLat), dLng = toR(bLng - aLng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toR(aLat)) * Math.cos(toR(bLat)) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
  }

  function naverUrl(c) {
    return 'https://m.map.naver.com/route.nhn?menu=route'
      + '&sname=' + encodeURIComponent('우리집') + '&sx=' + home.lng + '&sy=' + home.lat
      + '&ename=' + encodeURIComponent(c.n) + '&ex=' + c.x + '&ey=' + c.y
      + '&pathType=1&showMap=true';
  }

  function render() {
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    if (!home) {
      list.innerHTML = '<div class="empty">먼저 지도에서 우리집 위치를 탭해 주세요 👆</div>';
      count.textContent = '';
      return;
    }
    let items = COURSES.map(c => ({ ...c, d: dist(home.lat, home.lng, c.y, c.x) }));
    items.sort((a, b) => a.d - b.d);
    if (maxKm > 0) items = items.filter(c => c.d <= maxKm);

    count.textContent = '가까운 순 · ' + items.length + '곳' + (maxKm ? ' (' + maxKm + 'km 이내)' : '');
    if (items.length === 0) { list.innerHTML = '<div class="empty">조건에 맞는 골프장이 없어요.</div>'; return; }

    list.innerHTML = items.map(c => `
      <div class="course">
        <div class="c-left">
          <div class="c-name">${c.n}</div>
          <div class="c-dist">${c.d < 1 ? Math.round(c.d*1000)+' m' : c.d.toFixed(1)+' km'}</div>
        </div>
        <a class="nav-btn" href="${naverUrl(c)}" target="_blank" rel="noopener">네이버 길찾기</a>
      </div>`).join('');
  }

  render();
</script>
</body>
</html>
