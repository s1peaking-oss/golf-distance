<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>골프장 거리 계산기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Samsung Sans", "Roboto", "Segoe UI", sans-serif; background: #f4f5f7; color: #1a1a1a; }
  #app { max-width: 480px; margin: 0 auto; padding: 14px; }

  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .set-btn { border: none; background: #eef2ff; color: #4f46e5; font-weight: 700; font-size: 13px; padding: 9px 13px; border-radius: 10px; cursor: pointer; }
  .set-btn:active { background: #e0e7ff; }

  .origin { background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid #eef0f2; box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-size: 13.5px; }
  .origin .lab { color: #9ca3af; font-size: 12px; margin-bottom: 3px; }
  .origin .val { font-weight: 700; color: #111827; }

  .filter { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filter .lbl { font-size: 13px; color: #6b7280; margin-right: 2px; }
  .filter button { border: 1px solid #e2e5ea; background: #fff; color: #374151; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .filter button.active { background: #16a34a; color: #fff; border-color: #16a34a; }

  #map { width: 100%; height: 300px; border-radius: 16px; margin-bottom: 12px; z-index: 0; background: #e7eaee; border: 1px solid #eef0f2; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.5; }
  .leaflet-popup-content a { color: #03c75a; font-weight: 700; text-decoration: none; }

  .count { font-size: 12px; color: #9ca3af; margin: 2px 2px 8px; }

  .course { background: #fff; border-radius: 14px; padding: 13px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eef0f2; }
  .c-left { min-width: 0; flex: 1; }
  .c-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-dist { font-size: 13px; color: #16a34a; font-weight: 800; margin-top: 3px; }
  .c-addr { font-size: 11.5px; color: #9ca3af; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-btns { display: flex; flex-direction: column; gap: 6px; }
  .nav-btn { border: none; background: #03c75a; color: #fff; font-weight: 700; font-size: 12px; padding: 8px 10px; border-radius: 9px; text-decoration: none; text-align: center; white-space: nowrap; }
  .nav-btn:active { background: #02b350; }
  .copy-btn { border: none; background: #eef2f5; color: #374151; font-weight: 700; font-size: 12px; padding: 8px 10px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .copy-btn.done { background: #16a34a; color: #fff; }
  .empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 20px 0; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 380px; max-height: 92vh; overflow: auto; }
  .modal h2 { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .modal p { font-size: 12.5px; color: #6b7280; margin-bottom: 12px; }
  .addr-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .addr-row input { flex: 1; min-width: 0; border: 1px solid #d8dce2; border-radius: 11px; padding: 11px 12px; font-size: 14px; }
  .addr-row input:focus { outline: none; border-color: #16a34a; }
  .addr-row button { border: none; background: #eef2f5; color: #374151; font-weight: 700; font-size: 13px; padding: 0 15px; border-radius: 11px; cursor: pointer; white-space: nowrap; }
  #set-map { width: 100%; height: 220px; border-radius: 12px; background: #e7eaee; z-index: 0; }
  .picked { font-size: 12.5px; color: #16a34a; font-weight: 700; margin: 9px 2px 2px; min-height: 17px; }
  .m-actions { display: flex; gap: 8px; margin-top: 12px; }
  .m-actions button { flex: 1; border: none; border-radius: 11px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .save { background: #16a34a; color: #fff; }
  .gps { background: #eef2ff; color: #4f46e5; }
  .m-close { width: 100%; margin-top: 8px; border: none; background: transparent; color: #9ca3af; font-size: 13px; padding: 6px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <h1>⛳ 골프장 거리</h1>
    <button class="set-btn" id="open-set">⚙️ 출발지 설정</button>
  </div>

  <div class="origin" id="origin" style="display:none;">
    <div class="lab">출발지</div>
    <div class="val" id="origin-val">—</div>
  </div>

  <div class="filter">
    <span class="lbl">거리</span>
    <button data-km="0" class="active">전체</button>
    <button data-km="70">70km</button>
    <button data-km="90">90km</button>
    <button data-km="110">110km</button>
    <button data-km="130">130km</button>
  </div>

  <div id="map"></div>

  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>출발지 설정</h2>
    <p>지도를 <b>탭</b>해서 우리집 위치를 찍으세요. (지역 검색·현재 위치로 이동 후 탭하면 편해요)</p>
    <div class="addr-row">
      <input id="addr" type="text" placeholder="지역 검색 (예: 인천 송도동)" />
      <button id="addr-go">이동</button>
    </div>
    <div id="set-map"></div>
    <div class="picked" id="picked">지도를 탭해 위치를 선택하세요</div>
    <div class="m-actions">
      <button class="gps" id="use-gps">📍 현재 위치</button>
      <button class="save" id="save-home">저장</button>
    </div>
    <button class="m-close" id="close-set">닫기</button>
  </div>
</div>

    {n:"타뮤즈 골프빌리지 (제주)",y:33.3689588,x:126.3505941,a:"제주 제주시 애월읍 봉성리 산5"},
    {n:"테디밸리 골프&리조트 (제주)",y:33.2917697,x:126.3482597,a:"제주 서귀포시 안덕면 한창로 365"},
    {n:"핀크스GC (제주)",y:33.3053535,x:126.3937346,a:"제주 서귀포시 안덕면 산록남로 863"}
  ];

  let home = null, maxKm = 0, map, courseLayer, homeMarker;
  let setMap, setMarker, picked = null, pickedLabel = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function tile() { return L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO' }); }

  try { const saved = localStorage.getItem('golf_home'); if (saved) home = JSON.parse(saved); } catch (e) {}

  // 결과 지도
  map = L.map('map').setView([36.5, 127.8], 7);
  tile().addTo(map);
  courseLayer = L.layerGroup().addTo(map);
  setTimeout(() => map.invalidateSize(), 300);

  // 설정 모달 열기/닫기
  $('open-set').addEventListener('click', openSettings);
  $('close-set').addEventListener('click', () => $('overlay').classList.remove('show'));
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').classList.remove('show'); });

  function openSettings() {
    $('overlay').classList.add('show');
    if (!setMap) {
      setMap = L.map('set-map').setView(home ? [home.lat, home.lng] : [36.5, 127.8], home ? 12 : 7);
      tile().addTo(setMap);
      setMap.on('click', e => pick(e.latlng.lat, e.latlng.lng, null));
    }
    setTimeout(() => setMap.invalidateSize(), 150);
    if (home) { pick(home.lat, home.lng, home.addr); setMap.setView([home.lat, home.lng], 12); }
    else { picked = null; pickedLabel = null; if (setMarker) { setMap.removeLayer(setMarker); setMarker = null; } updatePicked(); }
  }
  function pick(lat, lng, label) {
    picked = { lat, lng }; pickedLabel = label;
    if (setMarker) setMarker.setLatLng([lat, lng]); else setMarker = L.marker([lat, lng]).addTo(setMap);
    updatePicked();
  }
  function updatePicked() {
    $('picked').textContent = picked
      ? ('✅ 선택: ' + (pickedLabel || (picked.lat.toFixed(4) + ', ' + picked.lng.toFixed(4))))
      : '지도를 탭해 위치를 선택하세요';
  }

  // 지역 검색 → 지도 이동
  $('addr-go').addEventListener('click', moveToAddr);
  $('addr').addEventListener('keydown', e => { if (e.key === 'Enter') moveToAddr(); });
  async function moveToAddr() {
    const q = $('addr').value.trim(); if (!q) return;
    const btn = $('addr-go'); btn.textContent = '…';
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=' + encodeURIComponent(q);
      const r = await fetch(url); const d = await r.json();
      if (!d.length) alert('지역을 못 찾았어요. 동/구 단위로 입력하거나 지도를 직접 탭해 주세요.');
      else { const lat = parseFloat(d[0].lat), lng = parseFloat(d[0].lon); setMap.setView([lat, lng], 13); pick(lat, lng, q); }
    } catch (e) { alert('검색 실패. 지도를 탭해 주세요.'); }
    btn.textContent = '이동';
  }

  // 현재 위치
  $('use-gps').addEventListener('click', () => {
    if (!navigator.geolocation) { alert('위치 기능을 사용할 수 없어요.'); return; }
    $('use-gps').textContent = '확인중';
    navigator.geolocation.getCurrentPosition(
      p => { const lat = p.coords.latitude, lng = p.coords.longitude; setMap.setView([lat, lng], 14); pick(lat, lng, '현재 위치'); $('use-gps').textContent = '📍 현재 위치'; },
      () => { alert('위치를 가져오지 못했어요. 지도를 탭해 주세요.'); $('use-gps').textContent = '📍 현재 위치'; }
    );
  });

  // 저장
  $('save-home').addEventListener('click', saveHome);
  async function saveHome() {
    if (!picked) { alert('먼저 지도를 탭해 위치를 선택하세요.'); return; }
    const btn = $('save-home'); btn.textContent = '저장중';
    let label = pickedLabel;
    if (!label) label = await reverseGeo(picked.lat, picked.lng);
    setHome(picked.lat, picked.lng, label || (picked.lat.toFixed(4) + ', ' + picked.lng.toFixed(4)));
    btn.textContent = '저장';
    $('overlay').classList.remove('show');
  }
  async function reverseGeo(lat, lng) {
    try {
      const url = 'https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ko&lat=' + lat + '&lon=' + lng;
      const r = await fetch(url); const d = await r.json(); const a = d.address || {};
      const parts = [a.province || a.state, a.city || a.county || a.town, a.borough || a.city_district || a.suburb || a.village, a.neighbourhood || a.quarter, a.road].filter(Boolean);
      return [...new Set(parts)].join(' ') || null;
    } catch (e) { return null; }
  }

  function setHome(lat, lng, addr) {
    home = { lat, lng, addr };
    try { localStorage.setItem('golf_home', JSON.stringify(home)); } catch (e) {}
    render();
  }

  // 거리 필터
  document.querySelectorAll('.filter button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.filter button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      maxKm = Number(b.dataset.km);
      render();
    });
  });

  function dist(aLat, aLng, bLat, bLng) {
    const R = 6371, toR = d => d * Math.PI / 180;
    const dLat = toR(bLat - aLat), dLng = toR(bLng - aLng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toR(aLat)) * Math.cos(toR(bLat)) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
  }
  function naverUrl(c) {
    return 'https://m.map.naver.com/route.nhn?menu=route&sname=' + encodeURIComponent('출발지')
      + '&sx=' + home.lng + '&sy=' + home.lat + '&ename=' + encodeURIComponent(c.n)
      + '&ex=' + c.x + '&ey=' + c.y + '&pathType=1&showMap=true';
  }

  function updateMap(items) {
    courseLayer.clearLayers();
    const pts = [];
    items.forEach(c => {
      const popup = '<b>' + esc(c.n) + '</b>'
        + (c.d != null ? '<br>📏 ' + (c.d < 1 ? Math.round(c.d*1000)+' m' : c.d.toFixed(1)+' km') : '')
        + '<br>' + esc(c.a)
        + (home ? '<br><a href="' + naverUrl(c) + '" target="_blank">네이버 길찾기 →</a>' : '');
      L.circleMarker([c.y, c.x], { radius: 6, color: '#fff', weight: 2, fillColor: '#16a34a', fillOpacity: 1 }).bindPopup(popup).addTo(courseLayer);
      pts.push([c.y, c.x]);
    });
    if (home) {
      if (homeMarker) homeMarker.setLatLng([home.lat, home.lng]);
      else homeMarker = L.circleMarker([home.lat, home.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#4f46e5', fillOpacity: 1 }).addTo(map).bindPopup('🏠 출발지');
      pts.push([home.lat, home.lng]);
    }
    if (pts.length) { try { map.fitBounds(L.latLngBounds(pts).pad(0.2)); } catch (e) {} }
  }

  function render() {
    const list = $('list'), count = $('count'), origin = $('origin');
    if (!home) {
      origin.style.display = 'none';
      list.innerHTML = '<div class="empty">⚙️ 출발지 설정에서 위치를 지정하면 가까운 순으로 정렬돼요</div>';
      count.textContent = '전국 골프장 ' + COURSES.length + '곳';
      updateMap(COURSES);
      return;
    }
    origin.style.display = 'block';
    $('origin-val').textContent = home.addr || (home.lat.toFixed(4) + ', ' + home.lng.toFixed(4));

    let items = COURSES.map(c => ({ ...c, d: dist(home.lat, home.lng, c.y, c.x) }));
    items.sort((a, b) => a.d - b.d);
    if (maxKm > 0) items = items.filter(c => c.d <= maxKm);

    count.textContent = '가까운 순 · ' + items.length + '곳' + (maxKm ? ' (' + maxKm + 'km 이내)' : '');
    updateMap(items);

    if (!items.length) { list.innerHTML = '<div class="empty">조건에 맞는 골프장이 없어요.</div>'; return; }
    list.innerHTML = items.map(c => `
      <div class="course">
        <div class="c-left">
          <div class="c-name">${esc(c.n)}</div>
          <div class="c-dist">${c.d < 1 ? Math.round(c.d*1000)+' m' : c.d.toFixed(1)+' km'}</div>
          <div class="c-addr">${esc(c.a)}</div>
        </div>
        <div class="c-btns">
          <a class="nav-btn" href="${naverUrl(c)}" target="_blank" rel="noopener">네이버 길찾기</a>
          <button class="copy-btn" data-addr="${esc(c.a)}">주소 복사</button>
        </div>
      </div>`).join('');
  }

  $('list').addEventListener('click', e => {
    const b = e.target.closest('.copy-btn');
    if (b) copyText(b.dataset.addr, b);
  });
  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text;
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    btn.textContent = '복사됨'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = '주소 복사'; btn.classList.remove('done'); }, 1300);
  }

  render();
  if (!home) openSettings();
</script>
</body>
</html>
